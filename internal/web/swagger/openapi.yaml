openapi: 3.0.3
info:
  title: brrewery API
  version: 0.1.0
  description: App catalog and session-authenticated management API.
servers:
  - url: /
    description: Current host
components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          description: >-
            When true, the session cookie persists for its full lifetime. When
            false (the default), a session-only cookie is issued that the browser
            clears when it closes.
    LoginResponse:
      type: object
      properties:
        username:
          type: string
    VerifyPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    VersionInfo:
      type: object
      properties:
        version:
          type: string
        commit:
          type: string
        date:
          type: string
    DetectionSpec:
      type: object
      properties:
        binaries:
          type: array
          items:
            type: string
        systemd_units:
          type: array
          items:
            type: string
        systemd_user_units:
          type: array
          description: Systemd unit templates expanded with the brrewery admin username ({user} placeholder).
          items:
            type: string
        paths:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
    PlaybookPaths:
      type: object
      properties:
        install:
          type: string
        upgrade:
          type: string
        remove:
          type: string
    InstallSecret:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Extra-var key supplied in the install request.
        label:
          type: string
        type:
          type: string
          enum: [password]
        verify_brrewery_password:
          type: boolean
          description: When true, the value must match the logged-in brrewery account password.
        disable_password_manager:
          type: boolean
          description: When true, the UI should not offer password-manager autofill or save prompts.
        help:
          type: string
          description: >-
            How to obtain the value, rendered under the field. Line breaks are
            significant and bare URLs are rendered as links.
    InstallOptionChoice:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          description: Value submitted as the extra-var when this choice is selected.
        label:
          type: string
    InstallOptionWhen:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Another option key whose selected value gates this option.
        one_of:
          type: array
          description: This option is shown only when the gating option's value is one of these.
          items:
            type: string
    InstallOption:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
          description: Extra-var key supplied in the install request.
        label:
          type: string
        type:
          type: string
          enum: [select]
        choices:
          type: array
          items:
            $ref: '#/components/schemas/InstallOptionChoice'
        when:
          $ref: '#/components/schemas/InstallOptionWhen'
    App:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
          description: URL path to the app icon bundled with the brrewery frontend.
        web_path:
          type: string
          description: Reverse-proxy path used to open the installed application.
        install_secrets:
          type: array
          items:
            $ref: '#/components/schemas/InstallSecret'
        install_options:
          type: array
          description: User-selected build parameters (e.g. qBittorrent version, libtorrent branch).
          items:
            $ref: '#/components/schemas/InstallOption'
        dependencies:
          type: array
          items:
            type: string
        detection:
          $ref: '#/components/schemas/DetectionSpec'
        playbooks:
          $ref: '#/components/schemas/PlaybookPaths'
    ServiceStatus:
      type: object
      required: [units, active, enabled, failing]
      description: >-
        Live systemd state of an installed app's controllable unit(s). Decoupled
        from `installed` (persistent artifacts) so an app stays listed while its
        service is stopped or disabled. The dashboard toggle is on when both
        `active` and `enabled` are true; a red backdrop is drawn behind the
        switch when `failing` is true.
      properties:
        units:
          type: array
          description: Resolved unit names this app controls ({user} instances expanded).
          items:
            type: string
        active:
          type: boolean
          description: True when every unit is running (systemctl is-active).
        enabled:
          type: boolean
          description: True when every unit is enabled (systemctl is-enabled).
        failing:
          type: boolean
          description: >-
            True when any unit is unhealthy — failed outright or stuck in a
            restart loop (crash-looping). Independent of `active`: a
            crash-looping unit reports active=false and failing=true.
    AppStatus:
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          properties:
            installed:
              type: boolean
            dependencies_satisfied:
              type: boolean
            service:
              description: Present only for installed apps that expose a controllable systemd service.
              $ref: '#/components/schemas/ServiceStatus'
    AppListResponse:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppStatus'
    JobAction:
      type: string
      enum: [install, upgrade, remove, self-update]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    Job:
      type: object
      required: [id, app_id, action, status, started_at]
      properties:
        id:
          type: string
        app_id:
          type: string
        action:
          $ref: '#/components/schemas/JobAction'
        status:
          $ref: '#/components/schemas/JobStatus'
        error:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    InstallRequest:
      type: object
      properties:
        extra_vars:
          type: object
          description: >-
            Install/upgrade parameters passed to Ansible. Values for install_secrets
            and install_options are supplied here. For qBittorrent, the optional
            libtorrent_patch key may carry a base64-encoded unified-diff libtorrent
            patch (max 512 KiB decoded) applied to a single build; it is never
            persisted to disk by brrewery.
          additionalProperties:
            type: string
    InstallResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
    SetServiceRequest:
      type: object
      required: [enabled, password]
      properties:
        enabled:
          type: boolean
          description: Target state — true starts & enables the service, false stops & disables it.
        password:
          type: string
          description: Operator account password, verified as a confirmation gate before the transition.
    JobLogsResponse:
      type: object
      properties:
        lines:
          type: array
          items:
            type: string
    UpdateStatus:
      type: object
      required: [current_version, update_available]
      properties:
        current_version:
          type: string
          description: Version of the running brrewery binary.
        latest_version:
          type: string
          description: Newest published release version, without the leading v.
        latest_tag:
          type: string
          description: Newest published release tag (e.g. v1.2.0).
        update_available:
          type: boolean
        checked_at:
          type: string
          format: date-time
          description: When GitHub was last queried successfully.
        error:
          type: string
          description: Failure of the most recent check; the other fields keep the last successful result.
        restart_pending:
          type: boolean
          description: An update has been installed and is waiting for the service restart that activates it.
    UpdateRestartResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [restarting]
    StartUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: Operator account password, verified as a confirmation gate before updating.
    LoadAvg:
      type: object
      properties:
        "1m":
          type: number
          format: double
        "5m":
          type: number
          format: double
        "15m":
          type: number
          format: double
    SystemMemory:
      type: object
      properties:
        total_bytes:
          type: integer
          format: int64
        available_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        used_percent:
          type: number
          format: double
    SystemDisk:
      type: object
      properties:
        mount:
          type: string
        total_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        available_bytes:
          type: integer
          format: int64
        used_percent:
          type: number
          format: double
        io_busy_percent:
          type: number
          format: double
          description: Block-device I/O busy percent for this mount (iostat %util from sysfs stat).
        read_bytes:
          type: integer
          format: int64
          description: Cumulative read bytes for the block device backing this mount.
        write_bytes:
          type: integer
          format: int64
          description: Cumulative write bytes for the block device backing this mount.
        read_ops:
          type: integer
          format: int64
          description: Cumulative read I/O operations for the block device backing this mount.
        write_ops:
          type: integer
          format: int64
          description: Cumulative write I/O operations for the block device backing this mount.
    NetworkCounters:
      type: object
      properties:
        rx_bytes:
          type: integer
          format: int64
        tx_bytes:
          type: integer
          format: int64
    TrafficPeriod:
      type: object
      properties:
        label:
          type: string
        rx_bytes:
          type: integer
          format: int64
        tx_bytes:
          type: integer
          format: int64
    VnstatReport:
      type: object
      properties:
        installed:
          type: boolean
        message:
          type: string
        version:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/TrafficPeriod'
        months:
          type: array
          items:
            $ref: '#/components/schemas/TrafficPeriod'
        total:
          $ref: '#/components/schemas/TrafficPeriod'
    SystemInfo:
      type: object
      properties:
        hostname:
          type: string
        uptime_seconds:
          type: number
          format: double
        cpu_count:
          type: integer
        cpu_name:
          type: string
        cpu_percent:
          type: number
          format: double
        load:
          $ref: '#/components/schemas/LoadAvg'
        memory:
          $ref: '#/components/schemas/SystemMemory'
        disks:
          type: array
          items:
            $ref: '#/components/schemas/SystemDisk'
          description: Disk usage for fstab mount points (swap and EFI excluded).
        network:
          $ref: '#/components/schemas/NetworkCounters'
    ThroughputSeries:
      type: object
      required: [key, points]
      properties:
        key:
          type: string
          enum: [rx, tx, read, write]
          description: Which line of the chart this series draws. Network history returns rx/tx, disk history read/write.
        points:
          type: array
          description: >-
            Bucket values in bytes per second, oldest first. A bucket with no
            sample is null so the chart leaves a gap rather than drawing a zero
            that was never measured.
          items:
            type: integer
            format: int64
            nullable: true
    IOHistoryReport:
      type: object
      required: [start_ms, end_ms, bucket_seconds, sample_seconds, smoothing_seconds, series]
      description: >-
        Throughput history the daemon keeps in memory, smoothed by a trailing
        moving average and downsampled to the requested number of buckets.
        Buckets are evenly spaced: bucket i starts at start_ms + i*bucket_seconds.
      properties:
        start_ms:
          type: integer
          format: int64
          description: Unix milliseconds of the first bucket.
        end_ms:
          type: integer
          format: int64
          description: Unix milliseconds of the end of the last bucket.
        bucket_seconds:
          type: number
          format: double
          description: Seconds of history averaged into each returned point.
        sample_seconds:
          type: number
          format: double
          description: Interval at which the daemon reads the underlying counters.
        smoothing_seconds:
          type: number
          format: double
          description: Width of the trailing moving average applied before downsampling.
        series:
          type: array
          items:
            $ref: '#/components/schemas/ThroughputSeries'
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Logout
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Logged out
  /api/v1/auth/verify-password:
    post:
      summary: Verify the session user's account password
      description: >-
        Checks a candidate password against the authenticated user's account
        without side effects. Backs the install password prompt's inline check.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequest'
      responses:
        '204':
          description: Password matches
        '400':
          description: Password missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Password does not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/version:
    get:
      summary: Version metadata
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps:
    get:
      summary: List apps
      security:
        - SessionAuth: []
      responses:
        '200':
          description: App list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps/{id}:
    get:
      summary: Get app by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: App detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStatus'
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /api/v1/apps/{id}/install:
    post:
      summary: Start app install job
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '202':
          description: Install job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: App already installed or dependencies not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps/{id}/upgrade:
    post:
      summary: Start app upgrade job
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '202':
          description: Upgrade job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: App not installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps/{id}/remove:
    post:
      summary: Start app remove job
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
      responses:
        '202':
          description: Remove job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: App not installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps/{id}/service:
    post:
      summary: Start & enable or stop & disable an installed app's systemd service
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetServiceRequest'
      responses:
        '200':
          description: Refreshed service state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '400':
          description: Missing password or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized or incorrect password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: App not installed or has no controllable service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}:
    get:
      summary: Get install job status
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/logs:
    get:
      summary: Get install job logs
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job log lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/update:
    get:
      summary: Self-update status
      description: >-
        Cached result of the periodic GitHub release check. Pass refresh=1 to
        query GitHub before answering; a failed refresh still returns 200 with
        the stale cache and its error field set.
      security:
        - SessionAuth: []
      parameters:
        - name: refresh
          in: query
          required: false
          description: When "1", query GitHub before answering.
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: Update status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Start self-update job
      description: >-
        Downloads the newest release archive, verifies its checksum and installs
        everything it ships (binary, web assets, ansible playbooks, nginx and
        systemd config). Progress is polled via the jobs endpoints; the job
        succeeds once everything is installed. The new version only starts
        serving after the separate restart endpoint is called.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartUpdateRequest'
      responses:
        '202':
          description: Update job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
        '400':
          description: Missing password or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized or incorrect password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An update is already in progress or no update is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Self-update not supported for this installation (e.g. development build)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/update/restart:
    post:
      summary: Restart brrewery to finish an installed update
      description: >-
        Restarts the brrewery service so the previously installed update starts
        serving. Only allowed while an installed update is waiting (see
        restart_pending on the update status); the restart signs every session
        out. No password re-check — the install that armed it was already
        password-gated.
      security:
        - SessionAuth: []
      responses:
        '202':
          description: Restart issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRestartResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No installed update is waiting for a restart, or an update is still in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system:
    get:
      summary: Host system metrics
      security:
        - SessionAuth: []
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not available on this platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/system/io-history:
    get:
      summary: Network and disk throughput history
      description: >-
        Returns the in-memory throughput history for one chart. The daemon
        samples counters once per second and retains 24 hours, so a dashboard
        that just opened can draw the whole range immediately.
      security:
        - SessionAuth: []
      parameters:
        - name: range
          in: query
          required: true
          description: How far back to plot, as a duration between 1s and 24h (e.g. 5m, 24h).
          schema:
            type: string
            example: 5m
        - name: points
          in: query
          required: true
          description: >-
            How many buckets to return. Charts pass their plot width in pixels
            so the response never carries more points than can be drawn.
          schema:
            type: integer
            minimum: 1
            maximum: 4000
        - name: mount
          in: query
          required: false
          description: >-
            Mount point to report disk throughput for. Omitted or empty returns
            network throughput. A mount with no samples in the window returns
            all-null series rather than an error.
          schema:
            type: string
      responses:
        '200':
          description: Downsampled throughput history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOHistoryReport'
        '400':
          description: Invalid or missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/traffic/vnstat:
    get:
      summary: Historic traffic from vnstat
      security:
        - SessionAuth: []
      parameters:
        - name: days
          in: query
          required: true
          description: Number of days of daily history to return
          schema:
            type: integer
            minimum: 1
        - name: months
          in: query
          required: true
          description: Number of months of monthly history to return
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: vnstat report or not-installed notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VnstatReport'
        '400':
          description: Invalid or missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: vnstat query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
