---
- hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    netronome_bin: /usr/local/bin/netronome
  roles:
    - brrewery_user
  tasks:
    - name: Look up brrewery user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ brrewery_user }}"
      register: brrewery_passwd

    - name: Set brrewery home directory fact
      ansible.builtin.set_fact:
        brrewery_home: "{{ brrewery_passwd.ansible_facts.getent_passwd[brrewery_user][4] }}"

    - name: Stop and disable netronome for brrewery user
      ansible.builtin.systemd:
        name: "netronome@{{ brrewery_user }}.service"
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: Remove nginx reverse proxy for netronome
      ansible.builtin.include_role:
        name: brrewery_nginx_site
        tasks_from: remove
      vars:
        brrewery_app_id: netronome

    - name: Remove netronome user config and data
      ansible.builtin.file:
        path: "{{ brrewery_home }}/.config/netronome"
        state: absent

    - name: Remove netronome binary
      ansible.builtin.file:
        path: "{{ netronome_bin }}"
        state: absent

    - name: List remaining netronome user service unit files
      ansible.builtin.shell: |
        set -o pipefail
        systemctl list-unit-files 'netronome@*.service' --no-legend --no-pager 2>/dev/null || true
      register: netronome_unit_files
      changed_when: false

    - name: Remove netronome systemd template when no instances remain
      ansible.builtin.file:
        path: /etc/systemd/system/netronome@.service
        state: absent
      when: netronome_unit_files.stdout_lines | length == 0
      notify: Reload systemd

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
