---
- hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    netronome_bin: /usr/local/bin/netronome
    netronome_port: 7575
  roles:
    - brrewery_user
  tasks:
    - name: Look up brrewery user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ brrewery_user }}"
      register: brrewery_passwd

    - name: Set brrewery home directory fact
      ansible.builtin.set_fact:
        brrewery_home: "{{ brrewery_passwd.ansible_facts.getent_passwd[brrewery_user][4] }}"

    - name: Ensure brrewery user home directory exists
      ansible.builtin.stat:
        path: "{{ brrewery_home }}"
      register: brrewery_home_dir

    - name: Fail when brrewery user home is missing
      ansible.builtin.fail:
        msg: "Home directory {{ brrewery_home }} for user {{ brrewery_user }} does not exist"
      when: not brrewery_home_dir.stat.exists

    - name: Ensure netronome config directory exists
      ansible.builtin.file:
        path: "{{ brrewery_home }}/.config/netronome"
        state: directory
        owner: "{{ brrewery_user }}"
        group: "{{ brrewery_group }}"
        mode: "0750"

    - name: Install Netronome runtime diagnostic dependencies
      ansible.builtin.apt:
        name:
          - iperf3
          - traceroute
          - mtr-tiny
          - vnstat
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Fetch latest netronome release metadata
      ansible.builtin.uri:
        url: https://api.github.com/repos/autobrr/netronome/releases/latest
        return_content: true
      register: netronome_release

    - name: Resolve netronome linux amd64 download URL
      ansible.builtin.set_fact:
        netronome_download_url: >-
          {{ netronome_release.json.assets
             | selectattr('name', 'search', 'linux_x86_64')
             | map(attribute='browser_download_url')
             | first }}

    - name: Download netronome release archive
      ansible.builtin.get_url:
        url: "{{ netronome_download_url }}"
        dest: /tmp/netronome.tar.gz
        mode: "0644"

    - name: Ensure netronome extract directory exists
      ansible.builtin.file:
        path: /tmp/netronome-extract
        state: directory
        mode: "0755"

    - name: Extract netronome binary
      ansible.builtin.unarchive:
        src: /tmp/netronome.tar.gz
        dest: /tmp/netronome-extract
        remote_src: true
        creates: /tmp/netronome-extract/netronome

    - name: Install netronome binary
      ansible.builtin.copy:
        src: /tmp/netronome-extract/netronome
        dest: "{{ netronome_bin }}"
        mode: "0755"
        remote_src: true

    - name: Generate netronome session secret
      ansible.builtin.command: openssl rand -hex 32
      register: netronome_session_secret
      changed_when: false

    - name: Write netronome config
      ansible.builtin.copy:
        dest: "{{ brrewery_home }}/.config/netronome/config.toml"
        owner: "{{ brrewery_user }}"
        group: "{{ brrewery_group }}"
        mode: "0640"
        force: false
        content: |
          # Managed by brrewery
          check_for_updates = false

          [database]
          type = "sqlite"
          path = "{{ brrewery_home }}/.config/netronome/netronome.db"

          [server]
          host = "127.0.0.1"
          port = {{ netronome_port }}
          base_url = "/netronome/"

          [logging]
          level = "info"

          [session]
          session_secret = "{{ netronome_session_secret.stdout }}"

          [auth]
          whitelist = []
          trusted_proxies = ["127.0.0.1"]

    - name: Require brrewery user password for netronome account
      ansible.builtin.assert:
        that:
          - brrewery_user_password is defined
          - brrewery_user_password | length > 0
        fail_msg: brrewery_user_password must be supplied for netronome install

    - name: Create netronome user matching brrewery admin
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n' "$BRREWERY_USER_PASSWORD" | \
          "{{ netronome_bin }}" create-user "{{ brrewery_user }}" \
            --config "{{ brrewery_home }}/.config/netronome/config.toml"
        touch "{{ brrewery_home }}/.config/netronome/.brrewery-user-created"
      become: true
      become_user: "{{ brrewery_user }}"
      environment:
        BRREWERY_USER_PASSWORD: "{{ brrewery_user_password }}"
      args:
        creates: "{{ brrewery_home }}/.config/netronome/.brrewery-user-created"
      no_log: true

    - name: Install netronome systemd template unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/netronome@.service
        mode: "0644"
        content: |
          [Unit]
          Description=netronome service for %i
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=%i
          Group=%i
          ExecStart={{ netronome_bin }} serve --config=/home/%i/.config/netronome/config.toml
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and start netronome for brrewery user
      ansible.builtin.systemd:
        name: "netronome@{{ brrewery_user }}.service"
        enabled: true
        state: started
        daemon_reload: true

    - name: Configure nginx reverse proxy for netronome
      ansible.builtin.include_role:
        name: brrewery_nginx_site
      vars:
        brrewery_app_id: netronome
        brrewery_app_web_path: /netronome/
        brrewery_app_upstream: http://127.0.0.1:{{ netronome_port }}
        brrewery_app_websocket: true

    - name: Flush handlers to ensure nginx reloads
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
