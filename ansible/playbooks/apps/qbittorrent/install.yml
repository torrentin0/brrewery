---
- hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    qbittorrent_webui_port: 8086
    qbittorrent_bin: /usr/local/bin/qbittorrent-nox
  roles:
    - brrewery_user
    - qbittorrent_build
  tasks:
    - name: Clean up qBittorrent build artifacts
      ansible.builtin.include_role:
        name: qbittorrent_build
        tasks_from: cleanup.yml

    - name: Look up brrewery user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ brrewery_user }}"
      register: brrewery_passwd

    - name: Set brrewery home directory fact
      ansible.builtin.set_fact:
        brrewery_home: "{{ brrewery_passwd.ansible_facts.getent_passwd[brrewery_user][4] }}"

    - name: Set qBittorrent default save path fact
      ansible.builtin.set_fact:
        qbittorrent_download_dir: "{{ brrewery_home }}/torrents/qbittorrent"

    - name: Ensure qBittorrent config and download directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ brrewery_user }}"
        group: "{{ brrewery_group }}"
        mode: "0750"
      loop:
        - "{{ brrewery_home }}/.config/qBittorrent"
        - "{{ qbittorrent_download_dir }}"

    - name: Write qBittorrent configuration
      ansible.builtin.copy:
        dest: "{{ brrewery_home }}/.config/qBittorrent/qBittorrent.conf"
        owner: "{{ brrewery_user }}"
        group: "{{ brrewery_group }}"
        mode: "0640"
        force: true
        content: |
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Address=127.0.0.1
          WebUI\Port={{ qbittorrent_webui_port }}
          WebUI\ReverseProxySupportEnabled=true
          WebUI\TrustedReverseProxiesList=127.0.0.1
          WebUI\Username={{ brrewery_user }}
          WebUI\Password_PBKDF2="{{ qbittorrent_webui_password_hash }}"

          [BitTorrent]
          # Default save path for new torrents
          Session\DefaultSavePath={{ qbittorrent_download_dir }}

          # Automatic torrent management mode by default
          Session\DisableAutoTMMByDefault=false

          # TCP only — no uTP
          Session\BTProtocol=TCP

          # No connection or upload slot limits
          Session\MaxConnections=-1
          Session\MaxConnectionsPerTorrent=-1
          Session\MaxUploads=-1
          Session\MaxUploadsPerTorrent=-1

          # Private-tracker friendly: no peer discovery
          Session\DHTEnabled=false
          Session\PeXEnabled=false
          Session\LSDEnabled=false

          # No queueing — all torrents run
          Session\QueueingSystemEnabled=false

          # libtorrent tuning
          Session\SuggestMode=true
          Session\SendBufferWatermark=204800
          Session\SendBufferLowWatermark=2048
          Session\SendBufferWatermarkFactor=250
          Session\MultiConnectionsPerIp=true
          Session\FilePoolSize=250000
          Session\PieceExtentAffinity=true
          Session\SocketBacklogSize=1500
          Session\AsyncIOThreadsCount=4
          Session\CoalesceReadWrite=false

    - name: Ensure vendored libraries are visible to the dynamic linker
      ansible.builtin.copy:
        dest: /etc/ld.so.conf.d/brrewery-vendored.conf
        mode: "0644"
        content: |
          # Managed by brrewery — vendored package libraries under /usr/local
          {{ qbittorrent_prefix | default('/usr/local') }}/lib
          {% if qbt_qt_method | default('vendored') == 'vendored' and qbt_qt_prefix_path | default('') | length > 0 %}
          {{ qbt_qt_prefix_path }}/lib
          {% endif %}

    - name: Refresh dynamic linker cache
      ansible.builtin.command:
        cmd: ldconfig
      changed_when: true

    - name: Install qBittorrent systemd template unit
      ansible.builtin.include_role:
        name: qbittorrent_build
        tasks_from: service_unit.yml

    - name: Enable and start qBittorrent for brrewery user
      ansible.builtin.systemd:
        name: "qbittorrent@{{ brrewery_user }}.service"
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for qBittorrent WebUI to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ qbittorrent_webui_port }}"
        timeout: 60

    - name: Configure nginx reverse proxy for qBittorrent
      ansible.builtin.include_role:
        name: brrewery_nginx_site
      vars:
        brrewery_app_id: qbittorrent
        brrewery_app_web_path: /qbittorrent/
        brrewery_app_upstream: http://127.0.0.1:{{ qbittorrent_webui_port }}
        brrewery_app_strip_path_prefix: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
